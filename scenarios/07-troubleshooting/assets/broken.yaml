apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
        - name: webapp
          # Bug 1: this tag does not exist -- causes ImagePullBackOff
          image: nginxdemos/hello:plain-text-typo
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: webapp-svc
spec:
  selector:
    # Bug 2: does not match webapp's actual label (app: webapp) -- zero endpoints
    app: web-app
  ports:
    - port: 80
      targetPort: 80
