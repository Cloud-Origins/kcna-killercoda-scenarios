apiVersion: v1
kind: Namespace
metadata:
  name: dev
---
apiVersion: v1
kind: Namespace
metadata:
  name: staging
---
apiVersion: v1
kind: Pod
metadata:
  name: dev-worker
  namespace: dev
  labels:
    app: worker
spec:
  containers:
    - name: worker
      image: busybox
      command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: staging-worker
  namespace: staging
  labels:
    app: worker
spec:
  containers:
    - name: worker
      image: busybox
      command: ["sleep", "3600"]
