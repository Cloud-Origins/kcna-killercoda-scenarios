apiVersion: v1
kind: Namespace
metadata:
  name: team-a
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-a-quota
  namespace: team-a
spec:
  hard:
    pods: "2"
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-a
  namespace: team-a
spec:
  containers:
    - name: app
      image: busybox
      command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-b
  namespace: team-a
spec:
  containers:
    - name: app
      image: busybox
      command: ["sleep", "3600"]
